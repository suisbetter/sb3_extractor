<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open Scratch Project</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #ececec;
    --panel: #f7f7f7;
    --border: #c9c9c9;
    --border-dark: #a8a8a8;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #ff8c1a;
    --accent-soft: #fff0dd;
    --row-hover: #fff5e9;
    --titlebar: #dedede;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: #1e1e2e;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 100vh;
    padding: 24px;
  }

  .window{
    width: 760px;
    max-width: 100%;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.08);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.15);
    user-select: none;
  }

  /* Title bar */
  .titlebar{
    height: 40px;
    background: linear-gradient(var(--titlebar), #d2d2d2);
    display:flex;
    align-items:center;
    padding: 0 12px;
    border-bottom: 1px solid var(--border-dark);
    position: relative;
  }
  .dots{ display:flex; gap:8px; }
  .dot{ width:12px; height:12px; border-radius:50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
  .dot.red{ background:#ff5f57; }
  .dot.yellow{ background:#febc2e; }
  .dot.green{ background:#28c840; }
  .title{
    position:absolute; left:0; right:0; text-align:center;
    font-size:13px; font-weight:600; color:#4a4a4a;
    pointer-events:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .title svg{ width:14px; height:14px; }

  /* Toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .status-text{
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .browse-btn{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 6px 12px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fff;
    color: var(--text);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s;
  }
  .browse-btn:hover{ background:#e8e8e8; }
  .browse-btn svg{ width:14px; height:14px; }

  /* Body: drop zone / preview area */
  .body{
    display:flex;
    height: 350px;
    position: relative;
    background: #fff;
  }

  .dropzone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding: 24px;
    cursor: pointer;
    background: #fafafa;
    border: 2px dashed var(--border);
    margin: 16px;
    border-radius: 10px;
    transition: all 0.2s;
  }
  .dropzone:hover, .dropzone.drag{
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .dropzone-icon{
    width: 48px;
    height: 48px;
    color: var(--accent);
  }
  .dropzone-title{
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .dropzone-subtitle{
    font-size: 12px;
    color: var(--muted);
  }

  /* Preview panel */
  .preview{
    display:none;
    width: 100%;
    height:100%;
    overflow-y:auto;
    padding: 16px;
    background: #fff;
  }
  .preview.show{ display:block; }
  .preview .summary{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .preview .stat{
    background:#faf5ee;
    border:1px solid #eee0cc;
    border-radius:8px;
    padding:10px 8px;
    text-align:center;
  }
  .preview .stat .num{ font-size:18px; font-weight:800; color: var(--accent); }
  .preview .stat .lbl{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }

  .sprite-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
    gap:10px;
  }
  .sprite-card{
    background:#fafafa;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
  }
  .sprite-thumb{
    width:100%;
    height:64px;
    border-radius:5px;
    background: repeating-conic-gradient(#eee 0% 25%, #f6f6f6 0% 50%) 50% / 12px 12px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
    overflow:hidden;
  }
  .sprite-thumb img{ max-width:100%; max-height:100%; object-fit:contain; }
  .sprite-card .sname{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .sprite-card .dot{ width:6px; height:6px; border-radius:50%; background:#9966ff; flex-shrink:0; }
  .sprite-card.stage .dot{ background:#4c97ff; }
  .sprite-card .smeta{ font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.5; }

  /* Footer */
  .footer{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .footer label{
    font-size:13px;
    color: var(--muted);
    flex-shrink:0;
  }
  .filename{
    flex:1;
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 10px;
    font-size:13px;
    outline:none;
    background:#fff;
  }
  .filename:focus{ border-color: var(--accent); }

  select.filetype{
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 10px;
    font-size:13px;
    background:#fff;
    color: var(--text);
    max-width: 170px;
  }

  .actions{
    display:flex;
    gap:8px;
    padding: 0 16px 14px;
    justify-content:flex-end;
  }
  .btn{
    padding: 7px 18px;
    border-radius:7px;
    font-size:13px;
    font-weight:500;
    border:1px solid var(--border);
    background:#fff;
    color: var(--text);
    cursor:pointer;
  }
  .btn:hover{ background:#f0f0f0; }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .btn.primary:hover{ background:#eb7d0a; }
  .btn.primary:disabled{
    background:#f3caa0;
    border-color:#f3caa0;
    cursor:default;
  }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background:#c7c7c7; border-radius:6px; border:2px solid #f7f7f7; }
  ::-webkit-scrollbar-track{ background:transparent; }

  #realFileInput{ display:none; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">
      <svg viewBox="0 0 24 24" fill="#ff8c1a"><circle cx="12" cy="12" r="10"/></svg>
      Open Scratch Project
    </div>
  </div>

  <div class="toolbar">
    <div class="status-text" id="statusText">No Scratch project selected</div>
    <button class="browse-btn" id="browseBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      Browse .sb3 File
    </button>
  </div>

  <div class="body" id="bodyArea">
    <div class="dropzone" id="dropzone">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16.5V3.75m0 0L7.5 8.25m4.5-4.5l4.5 4.5M21 12v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="dropzone-title">Drag and drop your .sb3 file here</div>
      <div class="dropzone-subtitle">or click anywhere to browse from your computer</div>
    </div>

    <div class="preview" id="previewPanel"></div>
  </div>

  <div class="footer">
    <label for="filenameInput">Selected:</label>
    <input class="filename" id="filenameInput" type="text" placeholder="No file chosen" readonly>
    <select class="filetype" id="filetypeSelect">
      <option>Scratch Projects (*.sb3)</option>
      <option>Zip Archives (*.zip)</option>
      <option>All Files</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn" id="cancelBtn">Reset</button>
    <button class="btn primary" id="openBtn" disabled>Extract & Open</button>
  </div>
</div>

<input type="file" id="realFileInput" accept=".sb3,.zip">

<script>
  // ── Electron integration ─────────────────────────────────────────────────
  // window.electronAPI is injected by preload.js when running inside Electron.
  // When opening in a browser, it is undefined and all paths fall back to the
  // standard <input type="file"> / Blob download approach.
  const isElectron = !!(window.electronAPI && window.electronAPI.isElectron);

  let loadedZip = null;
  let loadedProject = null;
  let loadedBuffer = null;   // raw ArrayBuffer of the original file (Electron)
  let assetUrls = {};

  const statusText = document.getElementById('statusText');
  const browseBtn = document.getElementById('browseBtn');
  const dropzone = document.getElementById('dropzone');
  const previewPanel = document.getElementById('previewPanel');
  const filenameInput = document.getElementById('filenameInput');
  const openBtn = document.getElementById('openBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const realFileInput = document.getElementById('realFileInput');

  // ── File-open: native dialog (Electron) or <input> (browser) ────────────
  async function openNativeDialog() {
    const result = await window.electronAPI.openFileDialog();
    if (result.canceled) return;
    if (result.error) { alert('Could not open file: ' + result.error); return; }
    // Wrap in a File-like object so loadFile() works unchanged
    const blob = new Blob([result.buffer]);
    const file = new File([blob], result.name);
    loadedBuffer = result.buffer;
    loadFile(file);
  }

  browseBtn.addEventListener('click', () => {
    if (isElectron) openNativeDialog();
    else realFileInput.click();
  });
  dropzone.addEventListener('click', () => {
    if (isElectron) openNativeDialog();
    else realFileInput.click();
  });

  realFileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) { loadedBuffer = null; loadFile(file); }
  });

  // Drag & drop handlers
  window.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  window.addEventListener('dragleave', e => { dropzone.classList.remove('drag'); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file) { loadedBuffer = null; loadFile(file); }
  });

  async function loadFile(file){
    const nameLower = file.name.toLowerCase();
    if (!nameLower.endsWith('.sb3') && !nameLower.endsWith('.zip')){
      alert("Please select a Scratch 3 project file (.sb3) or .zip archive.");
      return;
    }
    filenameInput.value = file.name;
    statusText.textContent = `Reading ${file.name}...`;

    try {
      const buffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buffer);
      const projectFile = zip.file('project.json');
      if (!projectFile) throw new Error('No project.json found inside the archive.');
      const project = JSON.parse(await projectFile.async('string'));
      
      loadedZip = zip;
      loadedProject = project;
      showPreview(zip, project, file.name);
      openBtn.disabled = false;
      statusText.textContent = `Loaded: ${file.name}`;
    } catch(err) {
      alert("Could not load file: " + err.message);
      resetView();
    }
  }

  function resetView(){
    loadedZip = null;
    loadedProject = null;
    Object.values(assetUrls).forEach(u => URL.revokeObjectURL(u));
    assetUrls = {};
    previewPanel.classList.remove('show');
    previewPanel.innerHTML = '';
    dropzone.style.display = 'flex';
    filenameInput.value = '';
    openBtn.disabled = true;
    statusText.textContent = 'No Scratch project selected';
    realFileInput.value = '';
  }

  cancelBtn.addEventListener('click', resetView);

  async function showPreview(zip, project, filename){
    dropzone.style.display = 'none';
    previewPanel.classList.add('show');
    previewPanel.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:10px;">Loading project preview...</div>`;

    const targets = project.targets || [];
    const stage = targets.find(t => t.isStage);
    const sprites = targets.filter(t => !t.isStage);
    const totalCostumes = targets.reduce((n, t) => n + (t.costumes || []).length, 0);
    const totalSounds = targets.reduce((n, t) => n + (t.sounds || []).length, 0);

    // Preload costume thumbnails
    const wanted = new Set();
    targets.forEach(t => {
      const c = (t.costumes || [])[t.currentCostume || 0];
      if (c) wanted.add(c.md5ext || (c.assetId + '.' + c.dataFormat));
    });

    for (const name of wanted){
      const entry = zip.file(name);
      if (!entry) continue;
      const ext = name.split('.').pop().toLowerCase();
      const mime = ext === 'svg' ? 'image/svg+xml' : ext === 'png' ? 'image/png' : 'image/jpeg';
      const blob = await entry.async('blob');
      assetUrls[name] = URL.createObjectURL(new Blob([blob], { type: mime }));
    }

    const allTargets = stage ? [stage, ...sprites] : sprites;
    const cards = allTargets.map(t => {
      const c = (t.costumes || [])[t.currentCostume || 0];
      const thumbName = c ? (c.md5ext || (c.assetId + '.' + c.dataFormat)) : null;
      const url = thumbName ? assetUrls[thumbName] : null;
      const label = t.isStage ? 'Stage' : t.name;
      return `
        <div class="sprite-card ${t.isStage ? 'stage' : ''}">
          <div class="sprite-thumb">${url ? `<img src="${url}">` : ''}</div>
          <div class="sname"><span class="dot"></span>${escapeHtml(label)}</div>
          <div class="smeta">${(t.costumes||[]).length} costumes · ${(t.sounds||[]).length} sounds</div>
        </div>
      `;
    }).join('');

    previewPanel.innerHTML = `
      <div class="summary">
        <div class="stat"><div class="num">${sprites.length}</div><div class="lbl">Sprites</div></div>
        <div class="stat"><div class="num">${totalCostumes}</div><div class="lbl">Costumes</div></div>
        <div class="stat"><div class="num">${totalSounds}</div><div class="lbl">Sounds</div></div>
        <div class="stat"><div class="num">${Object.keys(zip.files).filter(n=>!zip.files[n].dir).length}</div><div class="lbl">Total Files</div></div>
      </div>
      <div class="sprite-grid">${cards}</div>
    `;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function generateExecutableHtml(baseName, base64Data) {
    return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${escapeHtml(baseName)}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #111827;
            color: #f9fafb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 480px;
            max-width: 95vw;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        #title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e5e7eb;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #controls {
            display: flex;
            gap: 8px;
        }
        .btn {
            border: none;
            outline: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background-color: #22c55e; color: #ffffff; }
        .btn-stop { background-color: #ef4444; color: #ffffff; }
        .btn-fullscreen { background-color: #374151; color: #ffffff; }
        .btn:hover { opacity: 0.9; }
        #player-wrapper {
            position: relative;
            width: 480px;
            height: 360px;
            max-width: 95vw;
            max-height: calc(95vw * 0.75);
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        #player-container { width: 100%; height: 100%; }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1f2937;
            z-index: 10;
            font-size: 16px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- TurboWarp Scaffolding player engine -->
    <script src="https://packager.turbowarp.org/scaffolding/scaffolding-min.js"><\/script>
</head>
<body>
    <div id="header">
        <div id="title">${escapeHtml(baseName)}</div>
        <div id="controls">
            <button id="greenflag" class="btn btn-green" title="Start">▶ Start</button>
            <button id="stop" class="btn btn-stop" title="Stop">⏹ Stop</button>
            <button id="fullscreen" class="btn btn-fullscreen" title="Fullscreen">⛶ Fullscreen</button>
        </div>
    </div>
    
    <div id="player-wrapper">
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading Scratch Project...</div>
        </div>
        <div id="player-container"></div>
    </div>

    <script>
        const projectBase64 = "${base64Data}";

        async function initPlayer() {
            try {
                const binary = atob(projectBase64);
                const len = binary.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                const scaffolding = new Scaffolding.Scaffolding();
                scaffolding.width = 480;
                scaffolding.height = 360;
                scaffolding.resizeMode = "preserve-ratio";
                scaffolding.setup();

                const container = document.getElementById("player-container");
                scaffolding.appendTo(container);

                await scaffolding.loadProject(bytes.buffer);

                document.getElementById("loading").style.display = "none";
                scaffolding.greenFlag();

                document.getElementById("greenflag").onclick = () => scaffolding.greenFlag();
                document.getElementById("stop").onclick = () => scaffolding.stopAll();
                document.getElementById("fullscreen").onclick = () => {
                    const wrapper = document.getElementById("player-wrapper");
                    if (!document.fullscreenElement) {
                        wrapper.requestFullscreen().catch(err => console.error(err));
                    } else {
                        document.exitFullscreen();
                    }
                };
            } catch (err) {
                const loadingEl = document.getElementById("loading");
                if (loadingEl) {
                    loadingEl.innerHTML = "";
                    const msg = document.createElement("div");
                    msg.style.cssText = "color:#ef4444;padding:20px;text-align:center;";
                    msg.textContent = "Failed to load project: " + (err && err.message ? err.message : String(err));
                    loadingEl.appendChild(msg);
                }
            }
        }

        window.addEventListener("DOMContentLoaded", initPlayer);
    <\/script>
</body>
</html>`;
  }

  /* =========================================================
     Extraction & Bundling
     ========================================================= */
  openBtn.addEventListener('click', async () => {
    if (!loadedProject || !loadedZip){
      realFileInput.click();
      return;
    }

    openBtn.disabled = true;
    openBtn.textContent = 'Extracting...';

    try {
      const baseName = filenameInput.value.replace(/\.sb3$/i, '').replace(/\.zip$/i, '') || 'ScratchProject';
      const soundExtensions = ['.wav', '.mp3', '.ogg', '.flac', '.m4a', '.aac', '.wma'];

      // Get raw buffer of the sb3 file for executable HTML embedding
      const sb3Buffer = await loadedZip.generateAsync({ type: 'arraybuffer' });
      let binary = '';
      const bytes = new Uint8Array(sb3Buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      const base64Data = btoa(binary);
      const htmlContent = generateExecutableHtml(baseName, base64Data);

      // Create new clean organized ZIP
      const newZip = new JSZip();
      let counts = { sb3: 0, sound: 0, assets: 0 };

      // Put executable HTML inside sb3/
      newZip.file(`sb3/${baseName}.html`, htmlContent);

      for (const [filename, fileEntry] of Object.entries(loadedZip.files)) {
        if (fileEntry.dir) continue;
        const lower = filename.toLowerCase();
        const base = filename.split('/').pop();
        const ext = '.' + lower.split('.').pop();
        const data = await fileEntry.async('uint8array');

        if (lower === 'project.json' || lower.endsWith('.json')) {
          newZip.file(`sb3/${base}`, data);
          counts.sb3++;
        } else if (soundExtensions.includes(ext)) {
          newZip.file(`sound/${base}`, data);
          counts.sound++;
        } else {
          newZip.file(`assets/${base}`, data);
          counts.assets++;
        }
      }

      // ── Save: native dialog (Electron) or Blob download (browser) ─────────
      const outBlob = await newZip.generateAsync({ type: 'blob' });
      const suggestedName = `${baseName}_extracted.zip`;

      if (isElectron) {
        // Use native "Save As" dialog
        const outArrayBuffer = await outBlob.arrayBuffer();
        const saveResult = await window.electronAPI.saveFile(suggestedName, outArrayBuffer);
        if (!saveResult.success && saveResult.reason !== 'canceled') {
          alert('Could not save file: ' + saveResult.reason);
        }
      } else {
        // Browser: trigger download via invisible <a>
        const downloadUrl = URL.createObjectURL(outBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = suggestedName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
      }

      // Option to launch player directly
      const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
      const playerUrl = URL.createObjectURL(htmlBlob);

      const playNow = confirm(
        `Extraction Complete!\n\n` +
        `• Saved: ${suggestedName}\n` +
        `• Project JSON (sb3/): ${counts.sb3} file(s)\n` +
        `• Executable HTML (sb3/): ${baseName}.html\n` +
        `• Sound files (sound/): ${counts.sound} file(s)\n` +
        `• Assets (assets/): ${counts.assets} file(s)\n\n` +
        `Would you like to play the project in your browser now?`
      );
      if (playNow) {
        window.open(playerUrl, '_blank');
      }
    } catch (err) {
      alert('Error during conversion: ' + err.message);
    } finally {
      openBtn.disabled = false;
      openBtn.textContent = 'Extract & Open';
    }
  });
</script>

</body>
</html>
